<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockLab</title>
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .wrap { max-width: 460px; margin: 0 auto; padding: 36px 18px 48px; display: grid; gap: 18px; }
    .logo.big { font-size: 56px; text-align: center; }
    .card { background: var(--paper); color: var(--ink); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-card); display: grid; gap: 10px; }
    .card h2 { margin: 0; font-size: 22px; }
    .card p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
    .card .field { background: #fff; box-shadow: inset 0 0 0 2px var(--paper-2); text-transform: none; }
    .row { display: flex; gap: 8px; }
    .tilt-a { transform: rotate(-.6deg); } .tilt-b { transform: rotate(.5deg); }
  </style>
</head>
<body class="felt">
  <div class="wrap">
    <div class="logo big">$tockLab<small style="font-size:14px">Latihan jadi investor, tanpa risiko uang sungguhan</small></div>

    <section class="card tilt-a">
      <h2>Saya bandar</h2>
      <p>Buka meja dan bagikan kode ke pemain. Halaman bandar harus tetap terbuka selama permainan.</p>
      <button id="create" class="btn orange">Buat ruangan</button>
    </section>

    <section class="card tilt-b">
      <h2>Saya pemain</h2>
      <form id="join-form" style="display:grid;gap:10px">
        <input id="join-code" class="field" maxlength="5" autocapitalize="characters" placeholder="Kode ruangan, 5 karakter" style="text-transform:uppercase" required />
        <input id="join-name" class="field" maxlength="20" placeholder="Nama Anda" required />
        <button class="btn green">Gabung ke meja</button>
      </form>
    </section>

    <a class="btn" href="cara-main.html" style="text-align:center;text-decoration:none">Cara main</a>

    <section class="card">
      <h2>Layar bersama</h2>
      <p>Tampilkan papan pasar di TV atau laptop untuk semua pemain.</p>
      <div class="row">
        <input id="board-code" class="field" maxlength="5" autocapitalize="characters" placeholder="Kode" style="text-transform:uppercase" />
        <button id="open-board" class="btn">Buka papan</button>
      </div>
    </section>
  </div>

<script type="module">
  import { createRoom, joinRoom, toast } from './js/app.js';

  document.getElementById('create').onclick = async e => {
    e.target.disabled = true;
    try {
      const code = await createRoom();
      location.href = `bank.html?code=${code}`;
    } catch (err) { toast(err.message, 'error'); e.target.disabled = false; }
  };

  document.getElementById('join-form').onsubmit = async e => {
    e.preventDefault();
    const code = document.getElementById('join-code').value.trim().toUpperCase();
    const name = document.getElementById('join-name').value.trim();
    try {
      await joinRoom(code, name);
      location.href = `player.html?code=${code}`;
    } catch (err) { toast(err.message, 'error'); }
  };

  document.getElementById('open-board').onclick = () => {
    const code = document.getElementById('board-code').value.trim().toUpperCase();
    if (code) location.href = `board.html?code=${code}`;
  };
</script>
</body>
</html>
