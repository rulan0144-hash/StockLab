<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockLab • Papan</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="felt">
  <header class="topbar">
    <div class="logo">$tockLab<small>Papan pasar</small></div>
    <div class="rounds" id="rounds" aria-label="Ronde"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="pill phase" id="step"></span>
      <a class="pill" href="cara-main.html" target="_blank" style="color:inherit;text-decoration:none">Cara main</a>
      <span class="pill">Kode <code id="code"></code></span>
    </div>
  </header>

  <div id="tape" class="tape" hidden></div>

  <main id="message" class="hero" hidden></main>

  <section id="lobby" class="hero" hidden>
    <h1 style="font-size:34px;margin:0">Meja dibuka, ayo gabung</h1>
    <p>Buka <b id="join-url" style="color:#ffd27a"></b> di HP atau laptop, lalu masukkan kode</p>
    <div class="codebig" id="code-big"></div>
    <div class="joined" id="lobby-players"></div>
  </section>

  <div id="game" hidden>
    <section class="market" id="market"></section>
    <section class="deck">
      <div class="panel" style="align-self:start">
        <h2>Kartu aksi di meja <small>Dek <b id="deck"></b> · Buangan <b id="discard"></b></small></h2>
        <div class="hand" id="table"></div>
      </div>
      <div style="display:grid;gap:20px;align-content:start">
        <div class="panel"><h2>Pemain</h2><div class="seats" id="players"></div></div>
        <div class="panel"><h2>Catatan lantai bursa</h2><div class="tapelog" id="log"></div></div>
      </div>
    </section>
  </div>

  <section id="ended" class="hero" hidden></section>

<script type="module">
  import { E, subscribeDoc, roomRef, esc, SECTOR_NAME, SECTOR_COLOR, ACTION_DESC, STEP_LABEL, fmtDelta, ensureUser } from './js/app.js';

  const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
  const $ = id => document.getElementById(id);
  $('code').textContent = code || '-';
  $('code-big').textContent = code || '-';
  $('join-url').textContent = new URL('player.html', location.href).href;
  const only = id => ['message', 'lobby', 'game', 'ended'].forEach(k => { $(k).hidden = k !== id; });

  const TRACKS = { tambang: [2, 3, 5, 6, 8, 9], konsumer: [1, 2, 3, 4, 5, 6, 7, 8], keuangan: [1, 3, 4, 5, 6, 7, 9], agrikultur: [1, 2, 4, 5, 6, 8, 9] };
  const ICON = { tambang: '⛏️', konsumer: '🛍️', keuangan: '🏦', agrikultur: '🌾', reksadana: '📊' };
  const NAME_COLOR = SECTOR_COLOR;

  // Harga sebelumnya, untuk panah naik/turun di pita.
  let last = null, prev = null;
  function trackChange(prices, rfp) {
    const key = JSON.stringify(prices);
    if (last && last.key !== key) prev = last.prices;
    if (!last || last.key !== key) last = { key, prices: { ...prices }, rfp };
    return prev || last.prices;
  }
  const arrow = d => d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : '<span class="flat">–</span>';

  function chips(coins) {
    let left = Math.max(0, coins), out = [];
    for (const d of [50, 10, 5, 1]) {
      const n = Math.floor(left / d); left -= n * d;
      for (let i = 0; i < Math.min(n, 4); i++) out.push(`<span class="chip c${d}">${d}</span>`);
      if (n > 4) out.push(`<span style="align-self:center;font-size:11px;font-weight:700">×${n}</span>`);
    }
    return out.join('') || '<span style="font-size:12px;color:#7a8e89">kosong</span>';
  }

  function render(s) {
    if (s.sectorOrder && s.sectorOrder.length === 4) s.reksadanaPrice = E.priceOf(s, 'reksadana');
    const isLobby = s.status === 'lobby';
    $('step').textContent = STEP_LABEL[s.step] || '';
    $('rounds').innerHTML = isLobby ? '' : Array.from({ length: s.maxRounds }, (_, i) => {
      const n = i + 1; return `<span class="pip ${n < s.round ? 'done' : n === s.round ? 'now' : ''}"></span>`;
    }).join('') + `<b>Ronde ${s.round}/${s.maxRounds}</b>`;

    if (isLobby) {
      only('lobby'); $('tape').hidden = true;
      $('lobby-players').innerHTML = s.players.map(p => `<span>${esc(p.name)}</span>`).join('') || '<span style="opacity:.7">Belum ada pemain</span>';
      return;
    }
    if (s.status === 'ended') {
      only('ended'); $('tape').hidden = true;
      $('ended').innerHTML = `<h1 style="font-size:40px;margin:0 0 6px">🏆 ${esc(s.standings[0].name)} menang!</h1><p style="margin:0 0 18px">Skor = Koin + nilai saham − hutang</p>
        <div class="podium">${s.standings.map((r, i) => `<div class="p"><span>${i + 1}. ${esc(r.name)}</span><span class="num">${r.score} Koin</span></div>`).join('')}</div>`;
      return;
    }
    only('game');

    const before = trackChange(s.prices, s.round);
    const names = [...s.sectorOrder, 'reksadana'];
    const priceNow = sec => sec === 'reksadana' ? s.reksadanaPrice : s.prices[sec];
    // Pita harga
    const beforeRek = Math.floor((before[s.sectorOrder[1]] + before[s.sectorOrder[2]]) / 2);
    const item = sec => {
      const d = priceNow(sec) - (sec === 'reksadana' ? beforeRek : before[sec]);
      return `<span class="tape-item"><span class="nm">${SECTOR_NAME[sec]}</span><span class="px">${priceNow(sec)}</span>${arrow(d)}</span>`;
    };
    const run = names.map(item).join('');
    $('tape').hidden = false;
    $('tape').innerHTML = `<div class="tape-track">${run}${run}${run}${run}</div>`;

    // Papan sektor
    const cards = s.sectorOrder.map(sec => {
      const eco = s.lastEconomy && s.lastEconomy.revealed[sec];
      const kind = !eco ? 'sealed' : eco.purple ? 'purple' : eco.delta > 0 ? 'up' : eco.delta < 0 ? 'down' : 'flat';
      const ecoHtml = !eco
        ? `<div class="eco sealed"><span class="q">?</span><small>Kartu Ekonomi tertutup · sisa ${s.economyLeft[sec] ?? '-'}</small></div>`
        : `<div class="eco ${kind}">${eco.purple ? '' : `<span class="d">${eco.delta > 0 ? '+' : ''}${eco.delta}</span>`}<span class="n">${esc(eco.name)}</span></div>`;
      const rungs = [...TRACKS[sec]].reverse().map(p => {
        const here = p === s.prices[sec], start = p === 5;
        return `<div class="rung ${start ? 'start' : ''} ${here ? 'here' : ''}" ${here ? `style="background:${NAME_COLOR[sec]}"` : ''}><span>${p}</span>${here ? '<span class="tok"></span>' : start ? '<span class="tag">Harga awal</span>' : ''}</div>`;
      }).join('');
      const d = s.prices[sec] - before[sec];
      return `<article class="sector"><div class="sector-head" style="background:${NAME_COLOR[sec]}"><span><span class="ico">${ICON[sec]}</span>${SECTOR_NAME[sec]}</span><span class="big">${s.prices[sec]}</span></div>${ecoHtml}<div class="ladder">${rungs}</div></article>`;
    });
    const rek = `<article class="sector mf"><div class="sector-head" style="background:${NAME_COLOR.reksadana}"><span><span class="ico">${ICON.reksadana}</span>Reksadana</span></div>
      <div class="center"><div class="big-num">${s.reksadanaPrice}</div><small>Harga jual dan beli<br>½ × (${SECTOR_NAME[s.sectorOrder[1]]} + ${SECTOR_NAME[s.sectorOrder[2]]})</small></div></article>`;
    cards.splice(2, 0, rek);
    $('market').innerHTML = cards.join('');

    $('deck').textContent = s.deckCount;
    $('discard').textContent = s.discard.length;
    $('table').innerHTML = s.tableCards.length
      ? s.tableCards.map(c => `<div class="acard"><div class="top" style="background:${SECTOR_COLOR[c.sector]}">${ICON[c.sector]} ${SECTOR_NAME[c.sector]}</div><div class="nm">${c.action}</div><div class="ds">${ACTION_DESC[c.action] || ''}</div></div>`).join('')
      : '<p class="empty">Meja kosong. Kartu baru dibagikan di ronde berikutnya.</p>';

    $('players').innerHTML = s.players.map(p => {
      const hold = (p.cards || []).reduce((a, c) => { if (!c.isDebt) a[c.sector] = (a[c.sector] || 0) + c.multiplier; return a; }, {});
      const holdHtml = Object.entries(hold).map(([sec, n]) => `<span style="background:${SECTOR_COLOR[sec]}">${SECTOR_NAME[sec]} ${n}</span>`).join('');
      const debts = (p.cards || []).filter(c => c.isDebt).length;
      const turn = s.actorId === p.uid && ['action', 'sell'].includes(s.step);
      return `<div class="seat ${turn ? 'turn' : ''}"><div class="row"><span class="who"><span class="ord">${p.order}</span>${esc(p.name)}</span><span class="cash">${p.coins}</span></div>
        <div class="chips">${chips(p.coins)}</div>
        <div class="hold">${holdHtml || '<span style="background:#a9b8b4">belum ada saham</span>'}</div>
        ${debts ? `<div class="note warn">🏦 ${debts} kartu hutang</div>` : ''}${p.owe > 0 ? `<div class="note warn">Kurang bayar ${p.owe} Koin, harus pinjam</div>` : ''}
        ${s.step === 'bidding' && p.bidDone ? '<div class="note ok">✔ sudah melelang</div>' : ''}</div>`;
    }).join('');
    $('log').innerHTML = s.log.map(l => `<div><b>R${l.round}</b>${esc(l.text)}</div>`).join('');
  }

  if (!code) { only('message'); $('message').textContent = 'Tambahkan ?code=KODE di alamat halaman, atau buka dari beranda.'; }
  else {
    await ensureUser();
    subscribeDoc(roomRef(code), s => { if (!s) { only('message'); $('message').textContent = 'Ruangan tidak ditemukan.'; } else render(s); },
      () => { only('message'); $('message').textContent = 'Tidak bisa membaca ruangan. Periksa kode atau aturan Firestore.'; });
  }
</script>
</body>
</html>
